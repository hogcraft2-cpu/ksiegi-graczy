name: Publikuj Skryptorium i Bibliotekę

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    name: GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Pobierz pliki repozytorium
        uses: actions/checkout@v4
      - name: Skonfiguruj GitHub Pages
        uses: actions/configure-pages@v5
      - name: Przygotuj statyczną stronę
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Opublikuj stronę
        id: deployment
        uses: actions/deploy-pages@v4
